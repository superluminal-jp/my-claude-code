schema_version: '1.0'
workflow:
  id: speckit
  name: Full SDD Cycle
  version: 1.0.1
  author: GitHub
  description: "Runs specify \u2192 plan \u2192 tasks \u2192 implement with review\
    \ gates"
requires:
  speckit_version: '>=0.8.5'
  integrations:
    any:
    - alquimia
    - claude
    - copilot
    - gemini
    - opencode
inputs:
  spec:
    type: string
    required: true
    prompt: Describe what you want to build
  integration:
    type: string
    default: auto
    prompt: Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's
      initialized integration)
steps:
- id: specify
  type: command
  command: speckit.specify
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }} Cite authoritative sources for every non-obvious claim
      or decision: international standards, industry best practices, scientifically
      and academically accepted findings, and official documentation, each with its
      URL. For AWS use the AWS Knowledge and AWS Documentation MCP servers. Never
      state an unsourced claim as fact; mark unverified points as unverified.'
- id: plan
  type: command
  command: speckit.plan
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }} Cite authoritative sources for every non-obvious claim
      or decision: international standards, industry best practices, scientifically
      and academically accepted findings, and official documentation, each with its
      URL. For AWS use the AWS Knowledge and AWS Documentation MCP servers. Never
      state an unsourced claim as fact; mark unverified points as unverified. Record
      each citation with the decision it supports in research.md and plan.md.'
- id: tasks
  type: command
  command: speckit.tasks
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }} Cite authoritative sources for every non-obvious claim
      or decision: international standards, industry best practices, scientifically
      and academically accepted findings, and official documentation, each with its
      URL. For AWS use the AWS Knowledge and AWS Documentation MCP servers. Never
      state an unsourced claim as fact; mark unverified points as unverified.'
- id: analyze
  type: command
  command: speckit.analyze
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }} Cite authoritative sources for every non-obvious claim
      or decision: international standards, industry best practices, scientifically
      and academically accepted findings, and official documentation, each with its
      URL. For AWS use the AWS Knowledge and AWS Documentation MCP servers. Never
      state an unsourced claim as fact; mark unverified points as unverified.'
- id: apply-analyze-recommendations
  type: prompt
  integration: '{{ inputs.integration }}'
  prompt: 'Apply the remediation recommendations from the analysis report to spec.md,
    plan.md and tasks.md by returning to the owning artifact. Keep every change traceable.
    Cite authoritative sources for every non-obvious claim or decision: international
    standards, industry best practices, scientifically and academically accepted findings,
    and official documentation, each with its URL. For AWS use the AWS Knowledge and
    AWS Documentation MCP servers. Never state an unsourced claim as fact; mark unverified
    points as unverified.'
- id: implement
  type: command
  command: speckit.implement
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }} Cite authoritative sources for every non-obvious claim
      or decision: international standards, industry best practices, scientifically
      and academically accepted findings, and official documentation, each with its
      URL. For AWS use the AWS Knowledge and AWS Documentation MCP servers. Never
      state an unsourced claim as fact; mark unverified points as unverified.'
- id: converge
  type: command
  command: speckit.converge
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }} Cite authoritative sources for every non-obvious claim
      or decision: international standards, industry best practices, scientifically
      and academically accepted findings, and official documentation, each with its
      URL. For AWS use the AWS Knowledge and AWS Documentation MCP servers. Never
      state an unsourced claim as fact; mark unverified points as unverified.'
- id: implement-converge-recommendations
  type: command
  command: speckit.implement
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }} Implement only the tasks converge appended, once. Cite
      authoritative sources for every non-obvious claim or decision: international
      standards, industry best practices, scientifically and academically accepted
      findings, and official documentation, each with its URL. For AWS use the AWS
      Knowledge and AWS Documentation MCP servers. Never state an unsourced claim
      as fact; mark unverified points as unverified.'
- id: commit-implementation
  type: command
  command: speckit.git.commit
  integration: '{{ inputs.integration }}'
  input:
    args: implementation and converge changes
- id: code-review-fix
  type: prompt
  integration: '{{ inputs.integration }}'
  prompt: /code-review --fix
- id: commit-review-fixes
  type: command
  command: speckit.git.commit
  integration: '{{ inputs.integration }}'
  input:
    args: code-review fixes
- id: push
  type: shell
  run: git push -u origin HEAD
- id: open-pr
  type: prompt
  integration: '{{ inputs.integration }}'
  prompt: 'Open a pull request for the current branch with gh. Title in Conventional
    Commits form; body leads with the conclusion, then what changed, why, how it was
    verified, known limits, and a list of the cited sources with URLs. Report the
    PR URL and the verification results. Cite authoritative sources for every non-obvious
    claim or decision: international standards, industry best practices, scientifically
    and academically accepted findings, and official documentation, each with its
    URL. For AWS use the AWS Knowledge and AWS Documentation MCP servers. Never state
    an unsourced claim as fact; mark unverified points as unverified.'
- id: ci-wait
  type: shell
  run: gh pr checks --watch >/dev/null 2>&1 && echo CI_OK || echo CI_FAIL
- id: ci-fix-once
  type: if
  condition: '{{ steps.ci-wait.output.stdout | contains(''CI_FAIL'') }}'
  then:
  - id: ci-fix
    type: prompt
    integration: '{{ inputs.integration }}'
    prompt: 'CI reported errors on the open pull request. Read the failing check logs,
      fix the cause once, commit, and push. If it still fails afterwards, stop and
      report; do not retry. Cite authoritative sources for every non-obvious claim
      or decision: international standards, industry best practices, scientifically
      and academically accepted findings, and official documentation, each with its
      URL. For AWS use the AWS Knowledge and AWS Documentation MCP servers. Never
      state an unsourced claim as fact; mark unverified points as unverified.'
  - id: ci-push
    type: shell
    run: git push
