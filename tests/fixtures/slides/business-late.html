<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A business deck whose introduction runs long</title>
<!-- Two introduction slides push the answer to slide 4, and the deck has no
     next step. The checker must report the late answer and the missing
     closing only: the business form requires no method or discussion. -->
<style>
  body { margin: 0; background: #f2f2f2; font-family: sans-serif; }
  .sld-slide { position: relative; box-sizing: border-box; width: 1280px; height: 720px; margin: 0 auto 24px; overflow: hidden; background: #ffffff; color: #1a1a1a; }
  .frame { position: absolute; inset: 48px 64px 72px; display: flex; flex-direction: column; gap: 24px; }
  h1, h2, h3, p, ul { margin: 0; }
  h1 { font-size: 45px; } h2 { font-size: 32px; } h3 { font-size: 20px; }
  p, li, dt, dd, th, td { font-size: 20px; line-height: 1.5; }
  .sld-marking { position: absolute; top: 32px; right: 64px; margin: 0; }
</style>
</head>
<body data-form="business">
<main>
<section class="sld-slide" data-layout="title" aria-labelledby="f1">
  <p class="sld-marking" data-level="2"><span class="sld-marking__level">Level 2</span> <span class="sld-marking__scope">Team only</span></p>
  <div class="frame"><h1 id="f1">Slide 1 states one assertion</h1></div>
</section>
<section class="sld-slide" data-layout="premise" aria-labelledby="f2">
  <p class="sld-marking" data-level="2"><span class="sld-marking__level">Level 2</span> <span class="sld-marking__scope">Team only</span></p>
  <div class="frame"><h2 id="f2">Slide 2 states one assertion</h2></div>
</section>
<section class="sld-slide" data-layout="premise" aria-labelledby="f3">
  <p class="sld-marking" data-level="2"><span class="sld-marking__level">Level 2</span> <span class="sld-marking__scope">Team only</span></p>
  <div class="frame"><h2 id="f3">Slide 3 states one assertion</h2></div>
</section>
<section class="sld-slide" data-layout="answer" aria-labelledby="f4">
  <p class="sld-marking" data-level="2"><span class="sld-marking__level">Level 2</span> <span class="sld-marking__scope">Team only</span></p>
  <div class="frame"><h2 id="f4">Slide 4 states one assertion</h2></div>
</section>
<section class="sld-slide" data-layout="point" aria-labelledby="f5">
  <p class="sld-marking" data-level="2"><span class="sld-marking__level">Level 2</span> <span class="sld-marking__scope">Team only</span></p>
  <div class="frame"><h2 id="f5">Slide 5 states one assertion</h2></div>
</section>
<section class="sld-slide" data-layout="point" aria-labelledby="f6">
  <p class="sld-marking" data-level="2"><span class="sld-marking__level">Level 2</span> <span class="sld-marking__scope">Team only</span></p>
  <div class="frame"><h2 id="f6">Slide 6 states one assertion</h2></div>
</section>
</main>
</body>
</html>
